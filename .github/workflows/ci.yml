name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nothing in this workflow may change the runner's network configuration. The
# tool under test rewrites firewalls, so the job holds the boundary the test
# harness holds itself to: no nft, iptables, ip, tc or systemctl, no module
# loading, no writes under /etc, and no process this job did not start is ever
# signalled. DEADMAN_RUNNER is a belt for the harness's braces. Every call to
# the escalator is pinned to `false` by tests/run.sh anyway, so if a future
# test forgets, it fails instead of running something as root.
env:
  DEADMAN_RUNNER: 'false'

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit rather than a moving major tag: a takeover of the
      # upstream tag would otherwise change what runs before the first test.
      # Dependabot opens the PRs that move these hashes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck cannot be installed on the machine this code was written on
      # (no root, no package), so this job was the first place the tree was
      # linted at all. That has happened now, on every CI run through
      # 2026-09-26, and 0.11.0 has since been put on PATH by hand on that
      # machine too. apt rather than a downloaded release, to keep the
      # provenance short.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # Gate: --severity=error. That level carries the bugs that break a
      # rollback, quoting and expansion mostly. When this was written, nothing
      # had checked this tree at any level; the gate has run on every CI run
      # through 2026-09-26 and has claimed no file on any of them.
      #
      # The warning level is reported by the next step instead of gating, and
      # tests/run.sh uses --severity=warning when the tool is present locally.
      # The two thresholds were deliberately different until someone read the
      # warning report: an unverified threshold should not be what turns main
      # red, and a gate nobody has seen pass is not a gate. It has been read,
      # on those same runs. SC2155 in tests/run.sh on the two from 2026-09-23,
      # which 8a5f27d fixed, and nothing on the two from 2026-09-26. Raising
      # this gate to warning and deleting the report step is the step that
      # follows from that, and this file has not taken it.
      - name: shellcheck, gates the build
        run: |
          set -euo pipefail
          for file in bin/deadman-ssh lib/deadman-lib.sh hooks.d/* \
                      tests/run.sh tests/fixtures/bin/ss \
                      tests/fixtures/hooks.d/*; do
            shellcheck --severity=error "$file"
          done

      # Non-fatal, and not a substitute for the gate above. Its whole job is to
      # be read once and turned into either a fix or a threshold change.
      - name: shellcheck, reports only
        continue-on-error: true
        run: |
          set -euo pipefail
          for file in bin/deadman-ssh lib/deadman-lib.sh hooks.d/* \
                      tests/run.sh tests/fixtures/bin/ss \
                      tests/fixtures/hooks.d/*; do
            shellcheck --severity=warning "$file"
          done

  syntax:
    name: bash -n
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The check that did run locally, on every file, and is the floor this
      # repo's claims about syntax rest on. Cheap, and a parse error should read
      # as one rather than as twenty failed checks inside the suite.
      - name: Syntax check every shell file
        run: |
          set -euo pipefail
          for file in bin/deadman-ssh lib/deadman-lib.sh hooks.d/* \
                      tests/run.sh tests/fixtures/bin/ss \
                      tests/fixtures/hooks.d/*; do
            printf '%-38s ' "$file"
            bash -n "$file" && printf 'ok\n'
          done

  test:
    name: suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fatal on purpose: this suite is the only evidence a rollback can still
      # run end to end, so a green check mark here has to mean something.
      - name: Test suite
        run: bash tests/run.sh
