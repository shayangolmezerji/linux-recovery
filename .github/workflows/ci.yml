name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nothing in this workflow may change the runner's network configuration. The
# tool under test rewrites firewalls, so the job holds the boundary the test
# harness holds itself to: no nft, iptables, ip, tc or systemctl, no module
# loading, no writes under /etc, and no process this job did not start is ever
# signalled. DEADMAN_RUNNER is a belt for the harness's braces. Every call to
# the escalator is pinned to `false` by tests/run.sh anyway, so if a future
# test forgets, it fails instead of running something as root.
env:
  DEADMAN_RUNNER: 'false'

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit rather than a moving major tag: a takeover of the
      # upstream tag would otherwise change what runs before the first test.
      # Dependabot opens the PRs that move these hashes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shellcheck cannot be installed on the machine this code was written on
      # (no root, no package), so this job was the first place the tree was
      # linted at all. That has happened now, on every CI run through
      # 2026-09-26, and 0.11.0 has since been put on PATH by hand on that
      # machine too. apt rather than a downloaded release, to keep the
      # provenance short.
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      # Gate: --severity=warning, the level tests/run.sh uses locally when the
      # binary is on PATH.
      #
      # It started at --severity=error, with a second non-fatal step reporting
      # the warning level, because an unverified threshold should not be what
      # turns main red and a gate nobody has seen pass is not a gate. Both
      # halves have been read since. The error gate claimed no file on any run
      # through 2026-09-26. The warning report made exactly one finding across
      # all of them, SC2155 in tests/run.sh, on the runs of 2026-09-23 that
      # predate 8a5f27d, and nothing on the runner has printed one since. The
      # loop below was then run at warning over all eleven paths with 0.11.0 on
      # PATH here, clean, which is what turned raising the threshold into a
      # change rather than a guess.
      #
      # The report step went with it. Two steps over the same files, one of them
      # advisory, existed to learn what the stricter gate would cost. That is
      # known now, and an advisory step nobody is obliged to read is how the
      # old threshold stayed unverified for as long as it did.
      - name: shellcheck, gates the build
        run: |
          set -euo pipefail
          for file in bin/deadman-ssh lib/deadman-lib.sh hooks.d/* \
                      tests/run.sh tests/fixtures/bin/ss \
                      tests/fixtures/hooks.d/*; do
            shellcheck --severity=warning "$file"
          done

  syntax:
    name: bash -n
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The check that did run locally, on every file, and is the floor this
      # repo's claims about syntax rest on. Cheap, and a parse error should read
      # as one rather than as twenty failed checks inside the suite.
      - name: Syntax check every shell file
        run: |
          set -euo pipefail
          for file in bin/deadman-ssh lib/deadman-lib.sh hooks.d/* \
                      tests/run.sh tests/fixtures/bin/ss \
                      tests/fixtures/hooks.d/*; do
            printf '%-38s ' "$file"
            bash -n "$file" && printf 'ok\n'
          done

  test:
    name: suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fatal on purpose: this suite is the only evidence a rollback can still
      # run end to end, so a green check mark here has to mean something.
      - name: Test suite
        run: bash tests/run.sh
